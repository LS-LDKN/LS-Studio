<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>LS Studio | 1-Week Free Startup Sprint & MVP Engineering</title>
  <meta name="description" content="Turn your startup idea into a market-ready product. Start with a 1-Week Free Validation & Prototyping Sprint (₹0) under strict Mutual NDA protection." />

  <!-- Instant Theme Initialization (Prevents Flash of Unstyled Content) -->
  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem('ls_studio_theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Google Fonts: Plus Jakarta Sans & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
          },
          colors: {
            cream: {
              50: '#FFFDF9',
              100: '#FBF8F3',
              200: '#F6F0E6',
              300: '#EDE3D3',
              400: '#DFD1BC',
            },
            espresso: {
              950: '#170F0A',
              900: '#22160F',
              800: '#2E1E14',
              700: '#3B2314',
              600: '#5E4636',
              500: '#7D6351',
            },
            caramel: {
              600: '#8C5327',
              500: '#A66E38',
              400: '#C48B4E',
              300: '#D49B54',
            }
          }
        }
      }
    };
  </script>

  <style>
    html, body {
      max-width: 100%;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Prevent iOS Safari auto-zoom on form focus */
    input, select, textarea {
      font-size: 16px !important;
    }

    /* Safe area padding for iPhone/Android gesture bars */
    .pb-safe {
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
    }

    /* Custom subtle scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #F6F0E6;
    }
    .dark ::-webkit-scrollbar-track {
      background: #170F0A;
    }
    ::-webkit-scrollbar-thumb {
      background: #C48B4E;
      border-radius: 9999px;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-sheet {
      animation: fadeSlideUp 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
